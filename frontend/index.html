<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franklin Create MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f7f9fc; color: #111; }
    .container { max-width: 760px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 16px 32px rgba(0,0,0,.08); }
    h1, h2 { color: #111; }
    label { display: block; margin-top: 18px; }
    textarea, input[type=text] { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { margin-top: 24px; padding: 12px 20px; border: none; background: #2563eb; color: white; border-radius: 8px; cursor: pointer; }
    .results { margin-top: 24px; background: #eef2ff; padding: 18px; border-radius: 10px; }
    .question { margin-top: 20px; }
    .option { margin-top: 8px; }
    .link { margin-top: 12px; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Franklin Create MVP</h1>
    <p>Complete the sample questionnaire, then submit your answers to see a simple result summary.</p>

    <form id="questionnaire-form">
      <div id="questions"></div>
      <button type="submit">Submit Answers</button>
    </form>

    <div id="output" class="results" style="display:none;"></div>

    <a class="link" href="questionnaire.md" target="_blank">View the static questionnaire file</a>
  </div>

  <script>
    const backendUrl = 'http://localhost:8000';

    async function loadQuestions() {
      const response = await fetch(`${backendUrl}/api/questions`);
      const questions = await response.json();
      const container = document.getElementById('questions');
      container.innerHTML = '';

      questions.forEach(q => {
        const wrapper = document.createElement('div');
        wrapper.className = 'question';
        wrapper.innerHTML = `<h2>${q.id}. ${q.text}</h2>`;

        if (q.type === 'text') {
          wrapper.innerHTML += `<textarea name="question-${q.id}" rows="3" placeholder="Your answer..."></textarea>`;
        } else if (q.type === 'single') {
          q.options.forEach(option => {
            wrapper.innerHTML += `
              <label class="option">
                <input type="radio" name="question-${q.id}" value="${option}" required /> ${option}
              </label>
            `;
          });
        } else if (q.type === 'multi') {
          q.options.forEach(option => {
            wrapper.innerHTML += `
              <label class="option">
                <input type="checkbox" name="question-${q.id}" value="${option}" /> ${option}
              </label>
            `;
          });
        }

        container.appendChild(wrapper);
      });
    }

    document.getElementById('questionnaire-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const questions = document.querySelectorAll('.question');
      const answers = [];

      questions.forEach(q => {
        const id = q.querySelector('h2').textContent.split('.')[0];
        const inputs = q.querySelectorAll('input, textarea');
        const values = [];

        inputs.forEach(input => {
          if (input.type === 'checkbox' && input.checked) {
            values.push(input.value);
          }
          if (input.type === 'radio' && input.checked) {
            values.push(input.value);
          }
          if (input.tagName === 'TEXTAREA') {
            values.push(input.value.trim());
          }
        });

        answers.push({
          question_id: Number(id),
          answer: values.join(values.length > 1 ? ', ' : '')
        });
      });

      const response = await fetch(`${backendUrl}/api/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers })
      });

      const result = await response.json();
      const output = document.getElementById('output');
      output.style.display = 'block';
      output.innerHTML = `
        <h2>Results</h2>
        <p><strong>Score:</strong> ${result.score} / ${result.total}</p>
        <p><strong>Percentage:</strong> ${result.percentage}%</p>
        <p>${result.message}</p>
      `;
    });

    loadQuestions().catch(error => {
      document.getElementById('output').style.display = 'block';
      document.getElementById('output').textContent = 'Unable to load questions. Please make sure the backend is running on http://localhost:8000.';
    });
  </script>
</body>
</html>
