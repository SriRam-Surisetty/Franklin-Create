<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franklin Create MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f7f9fc; color: #111; }
    .container { max-width: 760px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 16px 32px rgba(0,0,0,.08); }
    h1, h2 { color: #111; }
    label { display: block; margin-top: 18px; }
    textarea, input[type=text] { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { margin-top: 24px; padding: 12px 20px; border: none; background: #2563eb; color: white; border-radius: 8px; cursor: pointer; }
    .results { margin-top: 24px; background: #eef2ff; padding: 18px; border-radius: 10px; }
    .question { margin-top: 20px; }
    .option { margin-top: 8px; }
    .link { margin-top: 12px; display: inline-block; }
    .conversation { margin-top: 20px; max-height: 400px; overflow-y: auto; }
    .message { margin-top: 16px; display: flex; }
    .message.bot { justify-content: flex-start; }
    .message.user { justify-content: flex-end; }
    .message-text { max-width: 80%; padding: 14px 18px; border-radius: 20px; line-height: 1.5; }
    .message.bot .message-text { background: #e0e7ff; color: #1e293b; border-bottom-left-radius: 4px; }
    .message.user .message-text { background: #2563eb; color: white; border-bottom-right-radius: 4px; }
    .hint { margin-top: 10px; font-size: 0.95rem; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Franklin Create MVP</h1>
    <p>Complete the sample questionnaire, then submit your answers to see a simple result summary.</p>

    <div id="conversation" class="conversation"></div>

    <form id="questionnaire-form">
      <div id="question-card" class="question"></div>
      <button id="submit-button" type="submit">Next</button>
    </form>

    <div id="output" class="results" style="display:none;"></div>

    <a class="link" href="questionnaire.md" target="_blank">View the static questionnaire file</a>
  </div>

  <script>
    const backendUrl = 'http://localhost:8000';
    let questions = [];
    let currentIndex = 0;
    const answers = [];

    function renderQuestion(q) {
      const container = document.getElementById('question-card');
      container.innerHTML = `<h2>${q.id}. ${q.text}</h2>`;
      container.dataset.questionId = q.id;
      container.dataset.questionType = q.type;

      if (q.type === 'text') {
        container.innerHTML += `<textarea id="answer-input" rows="4" placeholder="Type your answer..." required></textarea>`;
      } else if (q.type === 'single') {
        q.options.forEach(option => {
          container.innerHTML += `
            <label class="option">
              <input type="radio" name="answer" value="${option}" required /> ${option}
            </label>
          `;
        });
      } else if (q.type === 'multi') {
        q.options.forEach(option => {
          container.innerHTML += `
            <label class="option">
              <input type="checkbox" name="answer" value="${option}" /> ${option}
            </label>
          `;
        });
        container.innerHTML += `<p class="hint">Select one or more options, then click Next.</p>`;
      }

      const button = document.getElementById('submit-button');
      button.textContent = currentIndex === questions.length - 1 ? 'Finish' : 'Next';
    }

    function appendMessage(role, text) {
      const conv = document.getElementById('conversation');
      const message = document.createElement('div');
      message.className = `message ${role}`;
      message.innerHTML = `<div class="message-text">${text}</div>`;
      conv.appendChild(message);
      conv.scrollTop = conv.scrollHeight;
    }

    function collectAnswer() {
      const card = document.getElementById('question-card');
      const questionId = Number(card.dataset.questionId);
      const questionType = card.dataset.questionType;
      let answerValue = '';

      if (questionType === 'text') {
        const textarea = document.getElementById('answer-input');
        answerValue = textarea.value.trim();
      } else if (questionType === 'single') {
        const selected = document.querySelector('input[name="answer"]:checked');
        answerValue = selected ? selected.value : '';
      } else if (questionType === 'multi') {
        const checked = Array.from(document.querySelectorAll('input[name="answer"]:checked')).map(i => i.value);
        answerValue = checked.join(', ');
      }

      return { question_id: questionId, answer: answerValue };
    }

    async function loadQuestions() {
      const response = await fetch(`${backendUrl}/api/questions`);
      questions = await response.json();
      currentIndex = 0;
      appendMessage('bot', 'Welcome! I will ask you a few questions one by one.');
      renderQuestion(questions[currentIndex]);
    }

    document.getElementById('questionnaire-form').addEventListener('submit', async event => {
      event.preventDefault();
      const answer = collectAnswer();
      if (!answer.answer) {
        return;
      }

      answers.push(answer);
      appendMessage('user', answer.answer);

      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        appendMessage('bot', 'Thanks. Here is the next question:');
        renderQuestion(questions[currentIndex]);
        return;
      }

      appendMessage('bot', 'Great, submitting your answers now...');
      const response = await fetch(`${backendUrl}/api/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers })
      });

      const result = await response.json();
      const output = document.getElementById('output');
      output.style.display = 'block';
      output.innerHTML = `
        <h2>Results</h2>
        <p><strong>Score:</strong> ${result.score} / ${result.total}</p>
        <p><strong>Percentage:</strong> ${result.percentage}%</p>
        <p>${result.message}</p>
      `;

      appendMessage('bot', 'All done! Your answers are submitted.');
      document.getElementById('submit-button').disabled = true;
      document.getElementById('question-card').style.display = 'none';
    });

    loadQuestions().catch(error => {
      const output = document.getElementById('output');
      output.style.display = 'block';
      output.textContent = 'Unable to load questions. Please make sure the backend is running on http://localhost:8000.';
    });
  </script>
</body>
</html>
