services:
  api:
    build:
      context: ./backend
    container_name: franklin-create-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: franklin-create-openwebui
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment: {}

volumes:
  openwebui_data:
