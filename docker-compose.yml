services:
  api:
    build:
      context: ./backend
    container_name: franklin-create-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: franklin-create-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
